services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: medclear-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: medclear
      POSTGRES_USER: medclear_user
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - medclear_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medclear_user -d medclear"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - medclear-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: medclear-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - medclear_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - medclear-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medclear-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medclear_user:123456@postgres:5432/medclear
      REDIS_URL: redis://redis:6379

    ports:
      - "8080:8080"

    volumes:
      - ./:/app
      - medclear_chroma_data:/app/RAG/chroma_db

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medclear-network

  # Vite Frontend (Development)
  frontend:
    image: node:20-alpine
    container_name: medclear-frontend
    restart: unless-stopped

    working_dir: /app

    environment:
      VITE_API_URL: http://localhost:8080

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app

    command: sh -c "npm install && npm run dev"

    networks:
      - medclear-network

volumes:
  medclear_postgres_data:
  medclear_redis_data:
  medclear_chroma_data:

networks:
  medclear-network:
    driver: bridge
